<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>건강 포털</title>

<style>

body{
    margin:0;
    background:#f1f5f9;
    font-family:Arial;
    overflow:hidden;
}

/* 전체 */
.container{

    display:grid;

    grid-template-columns:
        0.7fr 1.3fr;

    gap:20px;

    padding:20px;

    height:100vh;

    box-sizing:border-box;
}

/* 왼쪽 */
.left-side{

    display:flex;

    flex-direction:column;

    gap:20px;
}

/* 오른쪽 */
.right-side{
    height:100%;
}

/* 카드 */
.card{

    background:white;

    border-radius:20px;

    padding:20px;

    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

/* 작은 카드 */
.small-card{
    flex:1;
}

/* 큰 카드 */
.big-card{
    height:calc(100vh - 40px);
}

/* 제목 */
h2{
    margin-top:0;
}

/* 입력창 */
input{

    width:70%;

    padding:15px;

    border-radius:10px;

    border:1px solid #ccc;

    font-size:16px;
}

/* 버튼 */
button{

    padding:13px 20px;

    border:none;

    background:#2563eb;

    color:white;

    border-radius:10px;

    cursor:pointer;

    font-size:15px;
}

/* 탭 버튼 */
.tab-buttons{
    margin-bottom:20px;
}

.tab-buttons button{
    margin-right:10px;
}

/* 뉴스 카드 */
.news-card{

    background:#f8fafc;

    padding:15px;

    border-radius:12px;

    margin-top:15px;
}

/* 결과 */
.result{

    margin-top:20px;

    white-space:pre-wrap;

    line-height:1.8;

    overflow-y:auto;

    max-height:500px;
}

/* 숨김 */
.hidden{
    display:none;
}

</style>

</head>
<body>

<div class="container">

    <!-- 왼쪽 -->
    <div class="left-side">

        <!-- 건강 정보 -->
        <div class="card small-card">

            <h2>📰 오늘의 건강 정보</h2>

            <div class="news-card">

                <h3>충분한 수면</h3>

                <p>
                    하루 7~8시간 수면은
                    면역력 유지에 좋습니다.
                </p>

            </div>

            <div class="news-card">

                <h3>수분 섭취</h3>

                <p>
                    물을 자주 마시면
                    건강 유지에 도움이 됩니다.
                </p>

            </div>

            <div class="news-card">

                <h3>가벼운 운동</h3>

                <p>
                    하루 30분 걷기는
                    건강 관리에 효과적입니다.
                </p>

            </div>

        </div>

        <!-- 미세먼지 -->
        <div class="card small-card">

            <h2>🌫 오늘의 미세먼지</h2>

            <div class="news-card">

                <h3>서울</h3>

                <p>미세먼지: 보통</p>

                <p>초미세먼지: 좋음</p>

            </div>

            <div class="news-card">

                <h3>건강 팁</h3>

                <p>
                    외출 후 손 씻기를 권장합니다.
                </p>

            </div>

        </div>

    </div>

    <!-- 오른쪽 -->
    <div class="right-side">

        <div class="card big-card">

            <!-- 탭 -->
            <div class="tab-buttons">

                <button onclick="showSearch()">
                    💊 약 검색
                </button>

                <button onclick="showRecommend()">
                    🤖 약 추천
                </button>

            </div>

            <!-- 약 검색 -->
            <div id="searchSection">

                <h2>💊 약 검색</h2>

                <input
                    type="text"
                    id="medicineInput"
                    placeholder="약 이름 입력"
                >

                <button onclick="medicineSearch()">
                    검색
                </button>

                <div
                    class="result"
                    id="medicineResult"
                ></div>

            </div>

            <!-- 약 추천 -->
            <div
                id="recommendSection"
                class="hidden"
            >

                <h2>🤖 약 추천</h2>

                <input
                    type="text"
                    id="recommendInput"
                    placeholder="예: 두통, 근육통"
                >

                <button onclick="recommendMedicine()">
                    추천
                </button>

                <div
                    class="result"
                    id="recommendResult"
                ></div>

            </div>

        </div>

    </div>

</div>

<script>

// ====================================
// 약 검색 탭
// ====================================
function showSearch(){

    document.getElementById(
        "searchSection"
    ).classList.remove("hidden");

    document.getElementById(
        "recommendSection"
    ).classList.add("hidden");
}


// ====================================
// 약 추천 탭
// ====================================
function showRecommend(){

    document.getElementById(
        "searchSection"
    ).classList.add("hidden");

    document.getElementById(
        "recommendSection"
    ).classList.remove("hidden");
}


// ====================================
// 약 검색
// ====================================
async function medicineSearch(){

    const medicine =
        document.getElementById(
            "medicineInput"
        ).value;

    const response =
        await fetch("/medicine-search", {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                medicine:medicine
            })

        });

    const data =
        await response.json();

    document.getElementById(
        "medicineResult"
    ).innerHTML = data.result;
}


// ====================================
// 약 추천
// ====================================
async function recommendMedicine(){

    const symptom =
        document.getElementById(
            "recommendInput"
        ).value;

    const response =
        await fetch("/medicine-recommend", {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                symptom:symptom
            })

        });

    const data =
        await response.json();

    document.getElementById(
        "recommendResult"
    ).innerHTML = data.result;
}

</script>

</body>
</html>
